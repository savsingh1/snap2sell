<?xml version="1.0" encoding="UTF-8"?>
<!--
  Snap2Sell app icon — hand-authored vector master (same design as assets/logo.svg).
  The existing brand design, rebuilt as clean geometry for crisp rendering
  at every size: cream square, off-white circle, purple camera with lens
  rings, teal price tag overlapping bottom-left, purple sparkle top-right.
  Brand colours: purple #5623E2, teal #00C9C1, off-white #EEEEEE,
  cream #F2ECDE. Raster assets are generated from this file at exact
  sizes (see scripts/generate_icons.py); never upscale a raster.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#F2ECDE"/>
  <circle cx="512" cy="512" r="494" fill="#EEEEEE"/>

  <!-- Camera body group -->
  <g fill="#5623E2">
    <!-- shutter dome (top-left) -->
    <circle cx="303" cy="332" r="45"/>
    <!-- viewfinder housing (top-centre) -->
    <rect x="378" y="243" width="278" height="118" rx="52"/>
    <!-- main body -->
    <rect x="185" y="325" width="667" height="437" rx="58"/>
  </g>

  <!-- Lens rings -->
  <circle cx="512" cy="532" r="156" fill="none" stroke="#EEEEEE" stroke-width="24"/>
  <circle cx="512" cy="532" r="96" fill="none" stroke="#EEEEEE" stroke-width="22"/>

  <!-- Sparkle (top-right), separated from the body by an off-white outline -->
  <path d="M755,252 C772,300 795,322 850,338 C795,354 772,376 755,424 C738,376 715,354 660,338 C715,322 738,300 755,252 Z"
        fill="#5623E2" stroke="#EEEEEE" stroke-width="22" stroke-linejoin="round"/>

  <!-- Price tag (bottom-left overlap), classic tag silhouette pointing
       to the upper right, with punched hole -->
  <g transform="translate(248 818) rotate(-47)">
    <path d="M28,-92 L215,-92 C238,-92 254,-82 268,-62 L318,0 L268,62 C254,82 238,92 215,92 L28,92 C4,92 -8,76 -8,52 L-8,-52 C-8,-76 4,-92 28,-92 Z"
          fill="#00C9C1" stroke="#EEEEEE" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="274" cy="0" r="27" fill="#EEEEEE"/>
  </g>
</svg>
