name: snap2sell
description: "Snap2Sell — Snap it. Sell it. Done. AI-powered resale listing app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Camera + gallery
  image_picker: ^1.0.7

  # Share sheet (cross-posting) + clipboard lives in flutter/services
  share_plus: ^10.0.2

  # File storage for persisted photos
  path_provider: ^2.1.2

  # Local-first persistence (Firebase-ready abstraction in storage_service.dart)
  shared_preferences: ^2.2.2

  # HTTP for the live AI vision service
  http: ^1.2.1

  # Best-effort "open marketplace sell page" links
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
