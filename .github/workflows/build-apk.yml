name: Build Snap2Sell APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Real AI vision needs OPENAI_API_KEY as a GitHub Actions secret.
      # Without it the app builds with the offline mock AI (demo data).
      - run: flutter build apk --debug --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
      - run: flutter build apk --release --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: snap2sell-apks
          path: build/app/outputs/flutter-apk/*.apk
