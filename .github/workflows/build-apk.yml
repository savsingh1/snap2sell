name: Build Snap2Sell APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Real AI vision goes through the Snap2Sell backend (Cloud Function),
      # which holds the Gemini key in Secret Manager. The app only needs the
      # backend URL + app secret as GitHub Actions secrets. Without them the
      # app builds with the offline mock AI (demo data).
      - run: flutter build apk --debug --dart-define=AI_BACKEND_URL=${{ secrets.AI_BACKEND_URL }} --dart-define=APP_API_SECRET=${{ secrets.APP_API_SECRET }}
      - run: flutter build apk --release --dart-define=AI_BACKEND_URL=${{ secrets.AI_BACKEND_URL }} --dart-define=APP_API_SECRET=${{ secrets.APP_API_SECRET }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: snap2sell-apks
          path: build/app/outputs/flutter-apk/*.apk
