name: verify-gemini-model

# End-to-end smoke test: proves a product photo can travel the complete flow
#   app bytes -> Snap2Sell backend (Cloud Function) -> Gemini
#   -> structured product identification -> listing fields
# using the repo's AI_BACKEND_URL + APP_API_SECRET secrets.
# The Gemini API key itself never appears here — it lives in the function's
# Secret Manager.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python3 -m pip install -q pillow

      - name: Probe the analysis backend end to end
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
          APP_API_SECRET: ${{ secrets.APP_API_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import base64, io, json, os, sys, time, urllib.request, urllib.error
          from PIL import Image, ImageDraw

          backend = os.environ.get("AI_BACKEND_URL", "").rstrip("/")
          secret = os.environ.get("APP_API_SECRET", "")
          assert backend.startswith("http"), "AI_BACKEND_URL secret is missing!"
          assert len(secret) > 8, "APP_API_SECRET secret is missing!"

          def make_image(kind):
              """Small synthetic test images for three item types."""
              img = Image.new("RGB", (640, 480), (210, 190, 160))
              d = ImageDraw.Draw(img)
              if kind == "wallet":
                  d.rectangle([180, 120, 460, 360], fill=(120, 80, 50),
                              outline=(60, 40, 20), width=8)
                  d.rectangle([300, 210, 380, 270], fill=(200, 170, 120),
                              outline=(60, 40, 20), width=4)
                  d.text((200, 380), "TEST WALLET", fill=(40, 40, 40))
              elif kind == "microwave":
                  d.rectangle([120, 140, 520, 380], fill=(230, 230, 230),
                              outline=(80, 80, 80), width=8)
                  d.rectangle([160, 180, 380, 340], fill=(30, 30, 30))
                  d.ellipse([430, 190, 490, 250], outline=(150, 40, 40), width=6)
                  d.ellipse([430, 270, 490, 330], outline=(150, 40, 40), width=6)
                  d.text((160, 390), "TEST MICROWAVE", fill=(40, 40, 40))
              else:  # chair
                  d.rectangle([280, 80, 360, 280], fill=(140, 100, 60), width=8)
                  d.rectangle([200, 280, 440, 330], fill=(140, 100, 60))
                  d.rectangle([220, 330, 250, 460], fill=(100, 70, 40))
                  d.rectangle([390, 330, 420, 460], fill=(100, 70, 40))
                  d.text((220, 400), "TEST CHAIR", fill=(40, 40, 40))
              buf = io.BytesIO()
              img.save(buf, format="JPEG", quality=80)
              return base64.b64encode(buf.getvalue()).decode()

          def post_image(b64, use_secret=True, timeout=90):
              payload = json.dumps(
                  {"imageBase64": b64, "mimeType": "image/jpeg"}).encode()
              headers = {"Content-Type": "application/json"}
              if use_secret:
                  headers["x-app-secret"] = secret
              req = urllib.request.Request(backend + "/", data=payload,
                                           headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      body = json.loads(e.read().decode())
                  except Exception:
                      body = {}
                  return e.code, body

          images = {k: make_image(k) for k in ("wallet", "microwave", "chair")}

          # 1) Negative test: no app secret must be rejected.
          status, _ = post_image(images["wallet"], use_secret=False)
          print(f"AUTH_CHECK no-secret STATUS={status}")
          assert status == 401, f"expected 401 without secret, got {status}"

          # 2) End-to-end: each image must return structured identification.
          required = ("suggested_title", "category", "condition", "confidence",
                      "short_description", "suggested_price")
          all_ok = True
          for kind, b64 in images.items():
              status, body = post_image(b64)
              ok_fields = (status == 200 and
                           all(k in body for k in required) and
                           isinstance(body.get("confidence"), (int, float)) and
                           0 <= body["confidence"] <= 100)
              title = str(body.get("suggested_title", ""))[:60]
              print(f"IMAGE={kind} STATUS={status} VALID={ok_fields} "
                    f"CONFIDENCE={body.get('confidence')} TITLE={title}")
              all_ok = all_ok and ok_fields
              time.sleep(2)

          print(f"BACKEND_E2E_OK={all_ok}")
          sys.exit(0 if all_ok else 1)
          PYEOF
